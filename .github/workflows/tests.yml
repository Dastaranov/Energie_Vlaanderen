name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Mét de db-extra. De databanktests draaien op SQLite in het geheugen en
      # hebben geen server nodig, maar ze importeren wel SQLAlchemy. Zonder de
      # extra liepen ze stuk bij het inlezen — en het zijn net de tests die de
      # weggegooide prijsrijen en de SCD2-sleutel bewaken.
      - name: Installeer package
        run: pip install -e ".[test,db]"

      # Smal en gericht op defecten: syntaxfouten en pyflakes, geen stijl. De
      # selectie staat in pyproject.toml met de verantwoording erbij. Bij het
      # aanzetten vond ze meteen een test die twee keer gedefinieerd was (de
      # eerste draaide nooit), een `groupby` waarvan het resultaat nergens
      # heen ging, en een per ongeluk geïmporteerde `unittest.result`.
      #
      # Vóór de tests, want een ongebruikte import of een dubbele definitie
      # wijst vaak naar het soort verschuiving waar de tests daarna op vallen.
      - name: Lint
        run: ruff check .

      # De integratietests vereisen een lokale dataset onder data/, en die
      # staat niet in git. Ze worden hier dus expliciet overgeslagen in
      # plaats van stil te falen op ontbrekende bestanden.
      - name: Unit tests
        run: pytest -q -m "not integration"

  masterdata:
    # Structurele controle op config/heffingen/ en config/bronregister.toml:
    # geen netwerk nodig, dus dit hoort bij elke commit te draaien. De
    # inhoudelijke controle tegen de live bronnen staat in bronbewaking.yml.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installeer package
        run: pip install -e ".[test]"

      # Zonder --streng: waarschuwingen (nog te verifiëren tarieven, een
      # ontbrekend volgend jaar) horen niet elke PR te blokkeren. De
      # geplande bronbewaking maakt er wel een issue van.
      - name: Controleer heffingen-masterdata
        run: python -m energie_vlaanderen.cli audit heffingen

      # Zelfde redenering als hierboven: config/hardware/ is handgeschreven
      # (geen scrapebare bron voor batterij-/omvormerspecificaties), en elk
      # model start ongeverifieerd totdat het tegen een datasheet gelegd is
      # — vandaar ook hier zonder --streng.
      #
      # Zonder --c10-26: de Synergrid-homologatielijst is een werkboek van
      # 1,4 MB dat buiten git blijft (zie data/datasheets/LEESMIJ.md). Die
      # controle draait lokaal en in de bronbewaking, niet hier.
      - name: Controleer hardware-masterdata
        run: python -m energie_vlaanderen.cli audit hardware

      # De bijdrage energiefonds is de enige heffing met een publieke,
      # jaarlijks bijgewerkte tabel. Hier wordt ze tegen de opgeslagen kopie
      # van die pagina gelegd — geen netwerk, dus dit hoort bij elke commit.
      # De live controle staat in bronbewaking.yml.
      #
      # Exitcode 1 betekent dat de masterdata en de opgeslagen kopie uiteen
      # zijn gaan lopen; dat is een defect in het repo en hoort rood te zijn.
      - name: Controleer energiefonds tegen de opgeslagen brontabel
        run: |
          python scripts/check_energiefonds.py \
            --html tests/fixturen/heffingen/vlaanderen_energiefonds_2026.html
