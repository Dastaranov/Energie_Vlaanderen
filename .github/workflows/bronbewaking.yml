name: Bronbewaking

# Drie dingen kunnen buiten dit repo veranderen zonder dat iemand het merkt:
# VREG of Synergrid publiceert een nieuw bronbestand, de wetgever wijzigt een
# heffing, of de Vlaamse overheid publiceert nieuwe energiefondstarieven. In beide gevallen blijft de code draaien en blijven de
# uitkomsten er geloofwaardig uitzien — ze zijn alleen verouderd. Deze
# workflow maakt dat zichtbaar door er een issue van te maken.
#
# Een openstaande bevinding wordt hier niet als build failure gerapporteerd.
# Een geplande workflow die maandenlang rood staat omdat er nog een tarief te
# verifiëren valt, wordt genegeerd — en dan mist ze ook de dag dat er echt
# iets stukgaat. Rood betekent hier: de controle zelf lukte niet.

on:
  schedule:
    # Elke werkdag om 06:30 UTC. VREG publiceert de V-test-data rond de 28e
    # van de maand; dagelijks kijken kost niets en scheelt weken vertraging.
    - cron: "30 6 * * 1-5"
  workflow_dispatch:
    inputs:
      jaar:
        description: "Jaar voor de tariefbestanden"
        required: false
        type: string

permissions:
  contents: read
  issues: write

jobs:
  bronnen:
    name: Nieuwe bronbestanden bij VREG/Synergrid
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installeer package
        run: pip install -e "."

      - id: check
        name: Vergelijk VREG- en Synergrid-pagina's met het bronregister
        env:
          JAAR: ${{ inputs.jaar }}
        run: |
          set +e
          python scripts/check_bronnen.py ${JAAR:+--jaar "$JAAR"} --json > bronnen.json
          code=$?
          set -e
          cat bronnen.json
          # 0 = niets nieuws, 3 = nieuwe bron, 2 = onbereikbaar.
          # Alleen 2 is een storing; 3 hoort een issue op te leveren.
          if [ "$code" = "2" ]; then
            echo "::error::VREG- of Synergrid-pagina onbereikbaar, of pagina-indeling gewijzigd."
            exit 1
          fi
          python -c "import json;print('status='+json.load(open('bronnen.json'))['status'])" \
            >> "$GITHUB_OUTPUT"

      - name: Meld nieuwe bronnen als issue
        if: steps.check.outputs.status == 'nieuw'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7
        env:
          # Via env en niet via ${{ }} in het script: de bestandsnamen komen
          # van een externe webpagina en horen als data behandeld te worden,
          # niet als stuk JavaScript.
          BRONNEN_JSON_PAD: bronnen.json
        with:
          script: |
            const fs = require("fs");
            const data = JSON.parse(fs.readFileSync(process.env.BRONNEN_JSON_PAD, "utf8"));
            const regels = data.nieuw.map(
              (item) =>
                `- **${item.kind}**: \`${item.verwerkt}\` → \`${item.online}\`\n  ${item.url}`
            );
            const synergridKinds = ["slp_ex", "rlp0n_elektriciteit", "rlp0n_gas", "spp"];
            const heeftVreg = data.nieuw.some((item) => !synergridKinds.includes(item.kind));
            const heeftSynergrid = data.nieuw.some((item) => synergridKinds.includes(item.kind));
            const titel = "Nieuwe bronbestanden beschikbaar bij VREG/Synergrid";
            const recept = [];
            if (heeftVreg) {
              recept.push(
                "# VREG (vtest, energieprijscurves, distributienettarieven):",
                "energievergelijker source download --year <jaar>",
                "energievergelijker staging parse --version <nieuwe versie>",
                "energievergelijker staging calibrate --version <nieuwe versie>",
                "python scripts/check_tarieven.py --versie <nieuwe versie>",
              );
            }
            if (heeftSynergrid) {
              recept.push(
                "# Synergrid (SLP-EX/RLP0N/SPP):",
                "energievergelijker synergrid download --year <jaar>",
                "energievergelijker staging parse --version <versie> --only profielen \\",
                "    --synergrid-version <synergrid-versie> --jaar <jaar>",
              );
            }
            recept.push("python scripts/check_bronnen.py --bijwerken --versie <nieuwe versie>");
            const body = [
              "De bronbewaking vond bestanden die nog niet verwerkt zijn.",
              "",
              ...regels,
              "",
              "Verwerken:",
              "```bash",
              ...recept,
              "```",
            ].join("\n");

            // Eén lopend issue volstaat: dagelijks een nieuwe aanmaken zou de
            // lijst volstampen met hetzelfde bericht.
            const bestaande = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "bronbewaking",
            });
            const open = bestaande.data.find((i) => i.title === titel);
            if (open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open.number,
                body: `Nog steeds open op ${new Date().toISOString().slice(0, 10)}:\n\n${regels.join("\n")}`,
              });
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: titel,
              body,
              labels: ["bronbewaking"],
            });

  masterdata:
    name: Dekking van de heffingen-masterdata
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installeer package
        run: pip install -e "."

      - id: check
        name: Controleer heffingen op dekking en verificatie
        run: |
          set +e
          python -m energie_vlaanderen.cli audit heffingen --json > heffingen.json
          code=$?
          set -e
          cat heffingen.json
          if [ "$code" != "0" ] && [ "$code" != "2" ]; then
            echo "::error::audit heffingen liep vast."
            exit 1
          fi
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          bevindingen = json.load(open("heffingen.json"))["bevindingen"]
          fouten = [b for b in bevindingen if b["ernst"] == "fout"]
          print(f"aantal_fouten={len(fouten)}")
          print(f"aantal_bevindingen={len(bevindingen)}")
          PY

      # Een fout is structureel — een gat tussen twee schijven, een ontbrekend
      # jaar. Dat is een echte defect in het repo en hoort de run rood te maken.
      - name: Faal op structurele fouten
        if: steps.check.outputs.aantal_fouten != '0'
        run: |
          echo "::error::De heffingen-masterdata bevat structurele fouten."
          exit 1

      - name: Meld openstaande verificaties als issue
        if: steps.check.outputs.aantal_bevindingen != '0'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7
        with:
          script: |
            const fs = require("fs");
            const data = JSON.parse(fs.readFileSync("heffingen.json", "utf8"));
            const regels = data.bevindingen.map(
              (b) => `- \`${b.ernst}\` **${b.onderwerp}**: ${b.bericht}`
            );
            const titel = "Heffingen-masterdata: openstaande punten";
            const body = [
              `Peildatum ${data.peildatum}.`,
              "",
              ...regels,
              "",
              "Een tarief verifiëren:",
              "```bash",
              "energievergelijker staging calibrate --version <versie>",
              "python scripts/check_tarieven.py --versie <versie>",
              "```",
            ].join("\n");

            const bestaande = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "bronbewaking",
            });
            const open = bestaande.data.find((i) => i.title === titel);
            if (open) {
              // Bijwerken in plaats van bijkomend commentaar: deze lijst is een
              // stand van zaken, geen gebeurtenis.
              if (open.body !== body) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: open.number,
                  body,
                });
              }
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: titel,
              body,
              labels: ["bronbewaking"],
            });

  energiefonds:
    name: Tarieven van de bijdrage energiefonds
    runs-on: ubuntu-latest

    # De enige heffing in dit repo met een publieke, jaarlijks bijgewerkte
    # tabel. Tot nu toe werd die met de hand vergeleken — het soort controle
    # dat precies één keer per jaar nodig is en daarom vergeten wordt.
    #
    # Er is nog een reden om hier te kijken: het energiefonds faalt *hard* op
    # een ontbrekend jaar (`HeffingenError`). Publiceert de Vlaamse overheid
    # het volgende jaar laat, dan valt elke berekening over januari stil. Dat
    # wil je in december weten, niet op 1 januari.

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installeer package
        run: pip install -e "."

      - id: check
        name: Vergelijk vlaanderen.be met de masterdata
        run: |
          set +e
          python scripts/check_energiefonds.py > energiefonds.txt 2>&1
          code=$?
          set -e
          cat energiefonds.txt
          # 0 = gelijk, 1 = uiteengelopen, 2 = kon niet controleren.
          if [ "$code" = "2" ]; then
            echo "::error::Tarieftabel van vlaanderen.be niet leesbaar; pagina-indeling gewijzigd?"
            exit 1
          fi
          echo "afwijking=$([ "$code" = "1" ] && echo ja || echo nee)" >> "$GITHUB_OUTPUT"
          grep -q "^LET OP" energiefonds.txt \
            && echo "volgend_jaar_ontbreekt=ja" >> "$GITHUB_OUTPUT" \
            || echo "volgend_jaar_ontbreekt=nee" >> "$GITHUB_OUTPUT"

      - name: Meld een afwijking als issue
        if: steps.check.outputs.afwijking == 'ja' || steps.check.outputs.volgend_jaar_ontbreekt == 'ja'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7
        env:
          RAPPORT_PAD: energiefonds.txt
        with:
          script: |
            const fs = require("fs");
            const rapport = fs.readFileSync(process.env.RAPPORT_PAD, "utf8");
            const titel = "Bijdrage energiefonds: tarieven bijwerken";
            const body = [
              "De tarieftabel op vlaanderen.be en `config/heffingen/bijdrage_energiefonds.toml`",
              "lopen uiteen, of het volgende kalenderjaar is nog niet gepubliceerd.",
              "",
              "```",
              rapport.trim(),
              "```",
              "",
              "Bijwerken: neem de nieuwe rijen over in",
              "`config/heffingen/bijdrage_energiefonds.toml` en leg de opgeslagen",
              "kopie in `tests/fixturen/heffingen/` naast de nieuwe pagina. Daarna:",
              "```bash",
              "python scripts/check_energiefonds.py",
              "pytest -q tests/test_energiefonds_ingest.py",
              "```",
            ].join("\n");

            const bestaande = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "bronbewaking",
            });
            const open = bestaande.data.find((i) => i.title === titel);
            if (open) {
              // Een stand van zaken, geen gebeurtenis: bijwerken in plaats van
              // er dagelijks een commentaar bij te zetten.
              if (open.body !== body) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: open.number,
                  body,
                });
              }
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: titel,
              body,
              labels: ["bronbewaking"],
            });
