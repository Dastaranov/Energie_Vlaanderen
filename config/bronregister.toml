# Welke bronbestanden de pipeline op dit moment verwerkt.
#
# `data/` staat niet in git, dus zonder dit register is er in CI geen enkel
# aanknopingspunt om te zien dát VREG iets nieuws publiceerde. Het register is
# die vaste referentie: `scripts/check_bronnen.py` haalt de VREG-pagina's op en
# vergelijkt de gevonden bestandsnamen hiermee.
#
# Bijwerken doe je niet met de hand maar met:
#
#     python scripts/check_bronnen.py --bijwerken
#
# en dan pas nadat `energievergelijker source download` en de parse-stap
# gedraaid hebben. Het register zegt "dit hebben we verwerkt", niet "dit staat
# online".
#
# `bestandsnaam` bevat bewust géén VersionId uit de URL: VREG hangt daar een
# nieuwe waarde aan bij elke herupload, ook als de inhoud ongewijzigd blijft,
# en dat zou dagelijks vals alarm geven. De naam draagt de periode
# (202608-...) en dat is precies het signaal dat telt.

bijgewerkt_op = "2026-08-31"
verwerkte_versie = "20260829T202059Z-853a7046"

