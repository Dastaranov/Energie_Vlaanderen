# Vervoerstarief aardgas (Fluxys) — de doorrekening van het vervoersnet op een
# distributienetaansluiting.
#
# Eenheid: EUR per kWh, EXCLUSIEF btw.
#
# WAAROM DIT BESTAND BESTAAT
# --------------------------
# vtest.be splitst de nettarieven voor aardgas in vier posten. Drie daarvan
# komen uit de VREG-distributiewerkboeken en klopten al exact voor alle acht
# netbeheerders (afwijking <= 3e-7 EUR/kWh). De vierde — "Afnametarief
# transport (per kWh)" — staat in geen enkel werkboek: het is geen
# distributietarief maar het vervoerstarief van Fluxys, dat de netbeheerder
# doorrekent. Het ontbrak daardoor volledig in dit repo, en maakte elke
# gasfactuur ongeveer 25 EUR per jaar te laag.
#
# Bij elektriciteit bestaat dit gat niet: het transporttarief van Elia blijkt
# al verrekend in de ODV-post van het distributiewerkboek.
#
# HOE HET CIJFER GECONTROLEERD IS
# -------------------------------
# CREG-nota (Z)3230 van 11 juni 2026: 1,56 EUR/MWh exclusief btw voor 2026,
# uniform voor heel België sinds 01/01/2026.
#
# Bevestigd met `energievergelijker staging calibrate --segment onderneming`:
# vijf verbruikspunten, alle vijf exact gereproduceerd door 0,00156 EUR/kWh.
# Een zoektocht over alle waarden met zeven decimalen laat precies één
# kandidaat over.
#
#     4.000 kWh ->  6,24 EUR     20.000 kWh -> 31,20 EUR
#    11.900 kWh -> 18,56 EUR     35.000 kWh -> 54,60 EUR
#    12.100 kWh -> 18,88 EUR
#
# Ook het sociaal tarief in de woningscrape rekent met dit tarief: 25,37 EUR
# op het standaardprofiel van 16.262 kWh, precies 16,262 x 1,56.
#
# WAAROM WONING EN ONDERNEMING VERSCHILLEN
# ----------------------------------------
# vtest.be rekent voor gewone woningproducten met 1,5565 EUR/MWh in plaats van
# 1,56 — consistent 0,22% lager, over vijf verbruikspunten van 4.000 tot
# 35.000 kWh. Op het standaardprofiel is dat 25,31 in plaats van 25,37 EUR,
# een verschil van 6 eurocent per jaar.
#
# Onderzocht en uitgesloten: afronding per maand, per kwartaal of per dag;
# een vaste term naast het kWh-tarief; een verband met de gastariefgroep
# (GAS_T1/T2). Het sociaal tarief en het segment onderneming gebruiken wél
# 1,56 exact. De oorzaak is niet vastgesteld.
#
# Keuze van 2026-09-01: vtest.be is hier de leidende bron. Deze toepassing
# vergelijkt met de officiële vergelijkingstool van VREG, en dan weegt
# overeenkomen met wat die tool een klant toont zwaarder dan overeenkomen met
# de CREG-nota waarop ze zich baseert. Woningproducten dragen daarom 1,5565,
# onderneming 1,56 — allebei zoals vtest.be ze werkelijk toepast.
#
# Dat is bewust géén poging tot verklaring: het verschil blijft onbegrepen,
# het wordt alleen niet langer als afwijking gemeld. Wijzigt het cijfer bij
# een volgende kalibratie, dan is de eerste vraag of vtest.be zijn berekening
# veranderd heeft.
#
# LET OP bij het sociaal tarief
# -----------------------------
# Dat valt onder `niet_zakelijk` maar rekent met 1,56 exact (25,37 EUR bij
# 16.262 kWh). Zodra sociale tarieven apart doorgerekend worden, hoort daar
# dus een eigen categorie bij; nu wordt er 6 cent per jaar te weinig
# aangerekend op een sociaal gastarief.
#
# NOG NIET GEDEKT
# ---------------
# - Periodes vóór 01/01/2026. Het tarief is uniform sinds die datum; wat
#   daarvoor gold is niet vastgesteld. De repository weigert die datums.
# - Dit is de doorrekening zoals ze op een distributienetaansluiting
#   terechtkomt. Fluxys hanteert voor wie rechtstreeks op het vervoersnet
#   zit een entry/exit-capaciteitsstructuur; die wordt hier niet gemodelleerd.

energievorm = "aardgas"
bron = "CREG-nota (Z)3230 van 11/06/2026 + vtest.be kalibratie 2026-08-31"

# Vóór 2026. De masterdata begon op 01/01/2026, waardoor een berekening over
# een periode die eerder start hard faalt -- correct gedrag bij ontbrekende
# data, maar het maakte de referentiefactuur onberekenbaar.
#
# De eindafrekening drukt 1,5599 EUR/MWh af over 25/06/2025-30/04/2026 en
# rekent 19,00 EUR aan op 12.181 kWh. Eén tarief voor de hele periode, dus
# geen mengeling van twee jaargangen -- de leverancier paste in 2025 hetzelfde
# tarief toe als in 2026.
#
# `geverifieerd = false`, en met opzet: wat vaststaat is dat *deze* leverancier
# dit tarief toepaste over *deze* periode. Of het al langer gold, en of andere
# leveranciers hetzelfde rekenden, is niet nagegaan. De CREG-nota noemt 1,56
# uniform sinds 01/01/2026 en zegt niets over de periode ervoor.
#
# Let op het verschil met de rij eronder: 1,5599 hier tegenover 1,5565 vanaf
# 2026. Dat is dezelfde onverklaarde 0,22%-afwijking tussen vtest.be en de
# CREG-nota die hierboven beschreven staat -- de factuur zit aan de CREG-kant.

[[tarief]]
klantcategorie = "niet_zakelijk"
eur_per_kwh = "0.0015599"
geldig_vanaf = "2023-01-01"
geverifieerd = false
bron = "ENGIE-eindafrekening 25/06/2025-30/04/2026: 19,00 EUR op 12.181 kWh, tarief afgedrukt als 1,5599 EUR/MWh. Ingangsdatum niet vastgesteld"

[[tarief]]
klantcategorie = "niet_zakelijk"
eur_per_kwh = "0.0015565"
geldig_vanaf = "2026-01-01"
geverifieerd = true
bron = "vtest.be kalibratie 2026-08-31, woningproducten, 5 verbruikspunten van 4.000 tot 35.000 kWh; wijkt 0,22% af van CREG-nota (Z)3230 (1,56) om onbekende reden, vtest is hier de leidende bron"

[[tarief]]
klantcategorie = "zakelijk_laagspanning"
eur_per_kwh = "0.00156"
geldig_vanaf = "2026-01-01"
geverifieerd = true
bron = "CREG-nota (Z)3230; vtest.be kalibratie 2026-08-31 segment onderneming, 5 verbruikspunten exact gereproduceerd"
