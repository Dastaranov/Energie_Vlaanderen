# Bijzondere accijns en energiebijdrage op elektriciteit (GN-code 2716).
#
# Bron: art. 39 van de programmawet van 25 december 2021 (wijzigt art. 419,
# punt k), van de wet van 22 december 2009 houdende diverse bepalingen inzake
# accijnzen), B.S. 31/12/2021.
# https://www.ejustice.just.fgov.be/cgi/article_body.pl?language=nl&pub_date=2021-12-31&caller=summary&numac=2021043625
# Lokale kopie van de wettekst: docs/tarief bijzonder accijns.md
#
# Eenheid: EUR per MWh jaarverbruik, degressief per verbruiksschijf.
#
# LET OP: dit zijn de wettelijke basiswaarden uit de programmawet van 2021.
# Latere indexeringen of hervormingen (bv. ongeverifieerde berichtgeving
# medio 2026 over een geleidelijke hervorming van de bijzondere accijns
# tussen 2026 en 2029) zijn hier NIET geverifieerd verwerkt. Periodiek
# herbevestigen tegen een actuele officiële bron — zie docs/manifest.md §14
# "Openstaande validaties".
#
# Aardgas wordt door deze bron niet gedekt (art. 39 regelt enkel GN-code
# 2716 = elektriciteit) — aardgas-heffingen zijn nog een open backlog-item.

energievorm = "elektriciteit"
bron = "Programmawet 25 december 2021, art. 39 (B.S. 31/12/2021)"

