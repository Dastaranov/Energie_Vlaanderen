[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "energievergelijker-v3"
version = "3.0.0"
description = "Modulaire energievergelijker voor Vlaanderen"
# 3.11 is de ondergrens omdat de masterdata via tomllib ingelezen wordt, en
# dat zit pas vanaf 3.11 in de standaardbibliotheek.
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "openpyxl>=3.1",
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    # Enkel voor `scenario.opslag.sla_op(..., formaat="yaml")` — tot nu toe
    # enkel transitief aanwezig (via een andere dependency), wordt hier een
    # eerste-klas import.
    "pyyaml>=6.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    # Zelfde versie lokaal als in CI, zodat de lintstap niet iets meldt wat
    # hier niet te reproduceren is.
    "ruff>=0.6",
]

scrape = [
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "selenium>=4.0",
]

# RLP0N en SLP-EX (Synergrid-verbruiksprofielen) worden gepubliceerd als
# .xlsb (Excel Binary Workbook), niet .xlsx — openpyxl leest dat formaat
# niet. SPP blijft gewoon .xlsx en heeft deze extra niet nodig.
profielen = [
    "pyxlsb>=1.0",
]

db = [
    "psycopg[binary]>=3.1",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "python-dotenv>=1.0",
]

[project.scripts]
energievergelijker = "energie_vlaanderen.cli:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: tests die een databank of een volledige lokale dataset vereisen",
    "bronnen: bronbestanden ophalen, bewaren en de marktprijsbronnen",
    "parsers: werkboeken lezen en normaliseren naar een canonieke vorm",
    "scrape: de live weg naar vtest.be (Selenium, HTML, kalibratie)",
    "databank: import, SCD2-historiek en de controles op de databank",
    "masterdata: handgeschreven gegevens in config/ (heffingen, hardware, netbeheerders)",
    "rekenen: de rekenengine en de hardwaremodellen",
    "dossier: het gebruikersdossier: model, inlezen, periodes, berekening",
    "cli: de commandoschil",
    "suite: controles op de organisatie van het pakket en de testsuite zelf",
]

[tool.ruff]
# Smal en gericht op defecten, niet op stijl. De brede regelsets van ruff
# melden 778 dingen in dit repo; daar een poort van maken zou betekenen dat de
# poort maanden rood staat en dus genegeerd wordt.
#
# Wat hier wél in staat, vond bij het aanzetten meteen drie echte dingen:
# een test die twee keer gedefinieerd was (de eerste draaide nooit), een
# `groupby` in de vtest-validator waarvan het resultaat nergens heen ging, en
# `from unittest import result`, twee keer, per ongeluk.
#
# Stijlregels mogen er later bij, per set en met een opruiming ervoor.
target-version = "py311"
line-length = 100

# `experiments/` is archief: code die uit src/ gehaald is en bewaard blijft,
# niet onderhouden wordt en soms bewust stuk is. Linten wat je niet onderhoudt
# levert alleen ruis op. Dat de bestanden die tests er nog uit importeren
# blijven werken, bewaakt de testsuite zelf.
exclude = ["experiments", "entso-e"]

[tool.ruff.lint]
select = [
    "E9",   # syntaxfouten en onparseerbare bestanden
    "F",    # pyflakes: onbekende namen, ongebruikte imports en variabelen,
            # dubbele definities, kapotte f-strings
]

[tool.ruff.lint.per-file-ignores]
# Deze modules bestaan om herbruikbare namen door te geven.
"src/energie_vlaanderen/cli/__init__.py" = ["F401"]
