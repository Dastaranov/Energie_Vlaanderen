[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "energievergelijker-v3"
version = "3.0.0"
description = "Modulaire energievergelijker voor Vlaanderen"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "openpyxl>=3.1",
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8"
]

scrape = [
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "selenium>=4.0",
]

db = [
    "psycopg[binary]>=3.1",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "python-dotenv>=1.0",
]

[project.scripts]
energievergelijker = "energievergelijker_v3.cli:main"

[tool.setuptools]
packages = ["energievergelijker_v3"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: tests die een volledige lokale dataset vereisen",
]