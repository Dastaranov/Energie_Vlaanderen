[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "energievergelijker-v3"
version = "3.0.0"
description = "Modulaire energievergelijker voor Vlaanderen"
# 3.11 is de ondergrens omdat de masterdata via tomllib ingelezen wordt, en
# dat zit pas vanaf 3.11 in de standaardbibliotheek.
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "openpyxl>=3.1",
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8"
]

scrape = [
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "selenium>=4.0",
]

# RLP0N en SLP-EX (Synergrid-verbruiksprofielen) worden gepubliceerd als
# .xlsb (Excel Binary Workbook), niet .xlsx — openpyxl leest dat formaat
# niet. SPP blijft gewoon .xlsx en heeft deze extra niet nodig.
profielen = [
    "pyxlsb>=1.0",
]

db = [
    "psycopg[binary]>=3.1",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "python-dotenv>=1.0",
]

[project.scripts]
energievergelijker = "energie_vlaanderen.cli:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: tests die een databank of een volledige lokale dataset vereisen",
    "bronnen: bronbestanden ophalen, bewaren en de marktprijsbronnen",
    "parsers: werkboeken lezen en normaliseren naar een canonieke vorm",
    "scrape: de live weg naar vtest.be (Selenium, HTML, kalibratie)",
    "databank: import, SCD2-historiek en de controles op de databank",
    "masterdata: handgeschreven gegevens in config/ (heffingen, hardware, netbeheerders)",
    "rekenen: de rekenengine en de hardwaremodellen",
    "dossier: het gebruikersdossier: model, inlezen, periodes, berekening",
    "cli: de commandoschil",
    "suite: controles op de organisatie van het pakket en de testsuite zelf",
]