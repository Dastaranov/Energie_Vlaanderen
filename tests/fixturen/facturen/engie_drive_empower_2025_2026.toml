# Referentiefactuur: eindafrekening ENGIE "Drive" → "Empower", elektriciteit
# met ToU-injectie én aardgas, netbeheerder **Fluvius Halle-Vilvoorde**.
#
# Geanonimiseerd. Naam, straat, EAN, klant- en meternummer staan hier niet in;
# het brondocument blijft lokaal in `data/referentie/` en valt buiten git.
#
# WAAROM DEZE FACTUUR NODIG IS
# ----------------------------
# Elke andere referentiefactuur in dit repo staat op Fluvius Midden-Vlaanderen.
# Zolang dat zo blijft, bewijst geen enkele toets dat de nettariefopzoeking
# werkelijk op de netbeheerder gaat en niet op een stilzwijgende standaard.
# Deze staat op Halle-Vilvoorde.
#
# WAT ZE ÓÓK BLOOTLEGT
# --------------------
# Ze is niet volledig door te rekenen, en de reden is structureel: **"Drive"
# verdween in juni 2025 uit de V-test-export.** ENGIE stopte de verkoop; de
# klant hield het contract tot 25/03/2026. De export bevat wat er te koop is,
# niet wat er loopt. `zoek_product()` weigert dan — terecht — en daarmee valt
# de héle berekening weg, ook de netkost en de heffingen, terwijl juist die
# twee niet van het product afhangen en volledig bekend zijn.

