# --------------------------------------------------------------------------
# Wat de simulatie ervan maakt
# --------------------------------------------------------------------------
#
# De volledige afrekening levert geen bedrag: "Drive" staat niet in de export
# voor juni 2025 en later. Wat wél getoetst is:
#
#   | post                            | simulatie | factuur | verschil |
#   |---------------------------------|----------:|--------:|---------:|
#   | netkost elektriciteit (FHV)     |   1153,65 | 1150,39 |    +3,26 |
#   | distributiekost aardgas (FHV)   |    219,78 |  220,94 |    -1,16 |
#
# Beide binnen een half procent, op een netbeheerder die verder in geen enkele
# referentiecase voorkomt. De nettariefopzoeking gaat dus werkelijk op de
# netbeheerder.
#
# Het laatste stuk van de afrekening — het product "Empower", 26/03/2026 tot
# 31/05/2026 — staat wél in de export en is als apart dossier na te rekenen
# (`tests/fixturen/dossiers/engie_empower_fhv_slot.toml`). De factuur drukt
# voor dat stuk zijn eigen bedragen af, dus die zijn rechtstreeks vergelijkbaar.
[simulatie]
elektriciteit_netkost_eur = "1153.65"
aardgas_distributiekost_eur = "219.78"
elektriciteit_fout = "Product 'Drive' van ENGIE niet gevonden voor 2025-06"

# Het Empower-stuk apart doorgerekend:
#
#   | post                       | simulatie | factuur | verschil |
#   |----------------------------|----------:|--------:|---------:|
#   | leverancier elektriciteit  |    332,85 |  293,26 |   +39,59 |
#   | injectievergoeding         |     31,75 |   26,30 |    +5,45 |
#   | leverancier aardgas        |     94,77 |   88,25 |    +6,52 |
#
# (293,26 = de 259,60 van de factuurregels plus het pro-rata-aandeel van de
# kosten groene stroom en WKK, die de factuur alleen over het volledige jaar
# afdrukt: 2.256 kWh x 1,100 + 2.256 kWh x 0,392 ct/kWh.)
#
# De richting is stelselmatig: de export rekent hoger. Twee oorzaken, beide
# eigen aan de bron en niet aan de code:
#
#   - de vaste vergoeding in de export is 84,91 EUR/jaar (elektriciteit) en
#     47,17 (gas), tegenover 80,19 en 42,45 op de kaart van de klant;
#   - de indexwaarde in de export voor april 2026 is 110,75 EUR/MWh, terwijl de
#     prijs die de leverancier aanrekende overeenkomt met 84,75. De export
#     draagt de waarde die VREG bij publicatie kende; de leverancier rekent af
#     met de gerealiseerde maandwaarde.
[simulatie.empower_slot]
leverancier_elektriciteit_eur = "332.85"
injectievergoeding_eur = "31.75"
leverancier_aardgas_eur = "94.77"
factuur_leverancier_elektriciteit_eur = "293.26"
factuur_injectievergoeding_eur = "26.30"
factuur_leverancier_aardgas_eur = "88.25"
