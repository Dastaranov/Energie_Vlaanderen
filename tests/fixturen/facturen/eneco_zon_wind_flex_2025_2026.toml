# Referentiefactuur: jaarafrekening Eneco "Zon & Wind Flex", elektriciteit.
#
# Geanonimiseerd. Naam, straat, EAN, klant-, factuur- en meternummer, het
# rekeningnummer en de domiciliëringsreferentie staan hier niet in; het
# brondocument blijft lokaal in `data/referentie/` en valt buiten git.
#
# WAAROM DEZE FACTUUR ZO NUTTIG IS
# --------------------------------
# Ze verbruikt 15,09 kWh over 369 dagen. Daardoor is de energiekost
# verwaarloosbaar en bestaat de factuur bijna volledig uit vaste posten — en
# die drukt Eneco één voor één af mét hun eenheidsprijs: afnametarief,
# databeheer, capaciteitstarief en het maximumtarief, elk per deelperiode.
# Geen enkele andere referentiefactuur in dit repo laat de netkost zo open zien.
#
# Ze is bovendien de enige die twee takken van `grid_cost()` werkelijk laat
# vuren: de **ondergrens van 2,5 kW** op het capaciteitstarief en het
# **maximumtarief** over het jaarverbruik. Bij een gewoon gezin blijft de
# capaciteit ruim boven de bodem en bijt de cap nooit.

[factuur]
bron = "Jaarafrekening Eneco Belgium nv, factuurdatum 2026-07-08"
soort = "afrekening"
periode_van = "2025-06-01"
periode_tot = "2026-06-04"
dagen = 369
leverancier = "Eneco Belgium"
product = "Eneco Zon & Wind Flex"
contracttype = "variabel"
tariefkaart_versie = "012210 (geldig vanaf 2023-01-01)"
netbeheerder = "Fluvius Midden-Vlaanderen"
netbeheerder_code = "FMV"
postcode = "9220"
meter = "digitaal"
totaal_excl_btw = "316.91"
totaal_incl_btw = "328.67"

[btw]
basis_0pct = "120.80"
btw_0pct = "0.00"
basis_6pct = "196.11"
btw_6pct = "11.76"
# De bijdrage energiefonds staat in de 0%-schaal: ze is een heffing per
# afnamepunt en draagt geen btw. Dat is een derde btw-behandeling naast de
# 6%-basis en de vrijstelling op de injectievergoeding.

[elektriciteit]
afname_kwh = "15.09"
registerschema = "enkelvoudig"
# Niet gemeten maar de wettelijke ondergrens, zoals de factuur hem afdrukt:
# de werkelijke maandpieken lagen eronder.
capaciteitstarief_kw = "2.5"

[elektriciteit.componenten]
energiekost_eur = "52.44"
nettarieven_eur = "142.95"
heffingen_eur = "121.52"

# Elke nettariefregel apart, met de eenheidsprijs die de factuur afdrukt.
# Twee dingen vallen hier op en ze bevestigen allebei onze data:
#
#   - het capaciteitstarief van FMV is 49,04 EUR/kW/jaar in 2025 en
#     50,12 in 2026 (28,75 = 49,0426 x 214/365; 11,12 = 50,1240 x 81/365;
#     125,33 = 2,5 x 50,1324 over het laatste stuk). Eneco proratiseert het
#     *tarief*, wij het bedrag — dezelfde uitkomst.
#   - het databeheer is 17,52 in 2025 en 17,84/17,86 in 2026, tegenover
#     17,51 en 17,85 in het VREG-werkboek: Eneco rondt het jaartarief op
#     centen af.
[[elektriciteit.netwerk.regel]]
post = "afnametarief"
van = "2025-06-01"
tot = "2025-12-31"
hoeveelheid_kwh = "14.68"
eenheidsprijs_ct_kwh = "5.29"
bedrag_eur = "0.77"

[[elektriciteit.netwerk.regel]]
post = "afnametarief"
van = "2026-01-01"
