eenheidsprijs_ct_kwh = "4.98"
bedrag_eur = "0.02"

[[elektriciteit.netwerk.regel]]
post = "capaciteitstarief"
van = "2025-06-01"
tot = "2025-12-31"
hoeveelheid_kw = "2.50"
eenheidsprijs_eur = "28.75"
bedrag_eur = "71.88"

[[elektriciteit.netwerk.regel]]
post = "capaciteitstarief"
