# --------------------------------------------------------------------------
# De heffingen, en de bevinding die eruit volgt
# --------------------------------------------------------------------------
#
# **Deze aansluiting betaalt de bijzondere accijns aan het niet-zakelijke
# tarief maar de bijdrage energiefonds aan het niet-residentiële.** Dat zijn
# twee heffingen uit twee wetten met twee eigen definities, en ze vallen hier
# niet samen.
#
# In de rekenengine sturen ze allebei op één veld: `Profile.segment`.
# "Woning" geeft niet_zakelijk + residentieel, elke andere waarde geeft
# zakelijk + niet_residentieel. Geen van beide reproduceert dus deze factuur.
# Zie de bevinding in `tests/test_referentiefacturen_reeks.py`.
[elektriciteit.heffingen]
bijzondere_accijns_eur = "0.72"
bijzondere_accijns_ct_kwh = "4.75"
bijdrage_energiefonds_2025_eur = "69.50"
bijdrage_energiefonds_2026_eur = "51.30"
bijdrage_energiefonds_totaal_eur = "120.80"
# 118,56 / 12 = 9,88 en 120,84 / 12 = 10,07 EUR per maand — exact de waarden
# die `config/heffingen/bijdrage_energiefonds.toml` voor 2025 en 2026 in de
# categorie "niet_residentieel" draagt. Die masterdata was tot nu toe alleen
# tegen zijn eigen bron (vlaanderen.be) gelegd; dit is de eerste bevestiging
# uit een betaalde factuur.
bijdrage_energiefonds_2025_eur_jaar = "118.56"
bijdrage_energiefonds_2026_eur_jaar = "120.84"
bijdrage_energiefonds_klantcategorie = "niet_residentieel"
# Eneco rekent op deze factuur geen bijdrage op de energie aan. Op de
# voorgaande jaarafrekening van hetzelfde afnamepunt staat ze wél, met
# 0,19260 ct/kWh — 1,9260 EUR/MWh, opnieuw de waarde uit de masterdata.
bijdrage_op_de_energie_eur = "0"

[elektriciteit.energie]
vaste_vergoeding_jaar = "49.59"
vaste_vergoeding_eur = "50.13"
groene_stroom_eur = "0.14"
wkk_eur = "0.07"
formule = "0,1 x BELPEX-RLP + 5,966"
# De factuur drukt de indexwaarden zelf af — 69,40967 EUR/MWh voor juni 2025,
# oplopend tot 99,22022 in het eerste kwartaal 2026. (Het document zet er zes
# nullen te veel achter: "6.940.967.000,00". Een opmaakfout van Eneco, geen
# eenheidsverschil: 0,1 x 69,40967 + 5,966 = 12,907 ct/kWh, en dat is de
# 12,91 die de eerste verbruiksregel afdrukt.)
index_naam = "BELPEX-RLP"
index_juni_2025_eur_mwh = "69.40967"

# --------------------------------------------------------------------------
# Wat de simulatie ervan maakt
# --------------------------------------------------------------------------
#
#   | post          | simulatie | factuur | verschil |
#   |---------------|----------:|--------:|---------:|
#   | netwerkkosten |    142,94 |  142,95 |    -0,01 |
#   | heffingen     |      0,75 |  121,52 |  -120,77 |
#   | leverancier   |     64,14 |   52,44 |   +11,70 |
#
# De netkost komt op één cent uit — over drie deelperiodes, twee tariefjaren,
# de ondergrens van 2,5 kW én de maximumtariefcorrectie. Dat is de sterkste
# bevestiging van `grid_cost()` die dit repo heeft.
#
# Het gat op de heffingen is de bijdrage energiefonds hierboven: het dossier
# staat op `segment = "Woning"` en dan rekent de engine het residentiële
# tarief van 0,00 EUR/maand. Het is dus geen rekenfout maar een ontbrekend
# onderscheid.
#
# De 11,70 op de leverancierskost is exact het verschil tussen de vaste
# vergoeding in de V-test-export (61,321 EUR/jaar) en die op de tariefkaart van
# de klant (49,59). Dezelfde oorzaak als bij "Direct Online": de export levert
# de kaart die vandaag verkocht wordt, niet die van een lopend contract.
[simulatie]
netwerkkosten_eur = "142.94"
heffingen_eur = "0.75"
leverancier_eur = "64.14"
export_vaste_vergoeding_jaar = "61.321"
