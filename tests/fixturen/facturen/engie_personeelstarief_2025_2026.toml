# --------------------------------------------------------------------------
# De gasheffingen, en de bevinding die eruit volgt
# --------------------------------------------------------------------------
#
# **De bijzondere accijns op aardgas is vóór 01/08/2026 niet vlak maar
# progressief, en onze masterdata modelleert hem als vlak.**
#
# `config/heffingen/bijzondere_accijns_aardgas.toml` draagt één schijf van
# 8,2415 EUR/MWh voor de hele periode vóór de hervorming. Dat cijfer is
# teruggerekend uit één factuur (12.181 kWh, 100,39 EUR) door te delen — dus
# het is een *gemiddelde*, geen tarief. Drie facturen samen laten zien dat het
# gemiddelde met het volume meestijgt:
#
#     12.181 kWh -> 100,39 EUR -> 8,2415 EUR/MWh
#     13.599 kWh -> 113,07 EUR -> 8,3146 EUR/MWh
#     14.230 kWh -> 118,79 EUR -> 8,3479 EUR/MWh
#
# Dat is precies de vorm van een progressieve tabel. Een tweeschijvenmodel met
# de grens op 12 MWh — dezelfde grens als het regime ná 01/08/2026 — en
# 8,23 EUR/MWh onder en ~8,98 boven reproduceert de eerste en de derde factuur
# tot op de cent en de tweede tot op vijf cent:
#
#     12.000 x 8,23 +   181 x 8,98 = 100,385   (factuur 100,39)
#     12.000 x 8,23 + 1.599 x 8,98 = 113,119   (factuur 113,07)
#     12.000 x 8,23 + 2.230 x 8,98 = 118,785   (factuur 118,79)
#
# Een jaarwisselstap is uitgesloten: de eerste tariefkaartperiode van déze
# factuur ligt volledig in 2025 en geeft 8,2798 EUR/MWh, terwijl de factuur met
# het laagste volume over een vrijwel gelijke periode op 8,2415 uitkomt — lager
# dan het zuivere 2025-cijfer. Alleen het volume verklaart de spreiding.
#
# 8,2300 is trouwens de waarde die vóór de "correctie" van augustus 2026 in de
# masterdata stond, uit een secundaire bron. Die was voor de eerste schijf
# blijkbaar juist; de correctie naar 8,2415 heeft een schijfgrens platgeslagen.
#
# De bovenste schijf is uit drie facturen afgeleid en niet uit een wettekst;
# `geverifieerd` hoort daar dus op false te staan tot ze bevestigd is.
#
# Let op bij het doorvoeren: `tests/test_referentiefactuur.py` eist de
# gasheffingen van de eerste referentiefactuur exact op 112,54 EUR bij
# 12.181 kWh. Met het tweeschijvenmodel wordt dat 112,53. Eén cent, maar in
# een test die exactheid claimt — hij hoort mee aangepast te worden, niet
# als onverwachte rode test ontdekt.
[aardgas.heffingen]
bijdrage_op_de_energie_eur = "14.20"
bijzondere_accijns_eur = "118.79"
bijzondere_accijns_kaart1_kwh = "1744"
bijzondere_accijns_kaart1_eur = "14.44"
bijzondere_accijns_kaart2_kwh = "12486"
bijzondere_accijns_kaart2_eur = "104.35"
# Afgedrukt op de prijsinformatiepagina. 0,9978 is óók wat de tweede
# ENGIE-factuur in deze reeks afdrukt; de masterdata draagt 0,9975 voor
# niet_zakelijk, teruggerekend uit een afgerond factuurbedrag.
bijdrage_op_de_energie_eur_mwh_afgedrukt = "0.9978"
bijzondere_accijns_eur_mwh_afgedrukt = "8.3479"
federale_bijdrage_eur_mwh = "0"

# --------------------------------------------------------------------------
# Wat de simulatie ervan maakt
# --------------------------------------------------------------------------
#
# Aardgas, venster 2025-05-08 .. 2026-05-07:
#
#   | post          | simulatie | factuur | verschil |
#   |---------------|----------:|--------:|---------:|
#   | netwerkkosten |    235,63 |  235,62 |    +0,01 |
#   | heffingen     |    131,47 |  132,99 |    -1,52 |
#   | leverancier   |    653,98 |  694,51 |   -40,53 |
#
# De netkost komt op één cent uit, over twee tariefjaren en met de
# RLP0-verdeling van het volume. Het gat van 1,52 op de heffingen is exact de
# progressieve accijnsschijf hierboven; met het tweeschijvenmodel wordt het
# 132,98 tegenover 132,99.
#
# De 40,53 op de leverancierskost is dezelfde oorzaak als bij de andere
# facturen in deze reeks: de export draagt de kaart die vandaag verkocht wordt
# (47,17 EUR/jaar vaste vergoeding) en niet die van het lopende contract
# (35,00 en 42,45), en de indexwaarde van de export is niet die waarmee de
# leverancier heeft afgerekend.
#
# Elektriciteit levert geen bedrag op, en dat is de bedoelde uitkomst.
[simulatie]
gas_netwerkkosten_eur = "235.63"
gas_heffingen_eur = "131.47"
gas_leverancier_eur = "653.98"
elektriciteit_fout = "Product 'personeelstarief' van ENGIE niet gevonden"
