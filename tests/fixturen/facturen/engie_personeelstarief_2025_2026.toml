# Referentiefactuur: eindafrekening ENGIE met **personeelstarief** voor
# elektriciteit en "Flow" voor aardgas.
#
# Geanonimiseerd. Naam, straat, EAN, klant- en meternummer staan hier niet in;
# het brondocument blijft lokaal in `data/referentie/` en valt buiten git.
#
# WAT DEZE FACTUUR TOETST
# -----------------------
# Twee dingen, en het eerste is een weigering.
#
# Het personeelstarief is geen marktaanbod: het staat niet op vtest.be en zal
# er nooit op staan. De juiste uitkomst van een berekening is dan geen bedrag
# maar een fout. `zoek_product()` levert die ook —
#     "Product 'personeelstarief' van ENGIE niet gevonden voor 2025-07 (afname)"
# — en dat is precies het gedrag dat bewaakt hoort te worden. Een engine die
# hier het dichtstbijzijnde marktproduct naast zou leggen, geeft een plausibel
# ogend en volledig verzonnen bedrag.
#
# Het tweede is gewoon aardgas, en dat rekent wél helemaal door.

[factuur]
bron = "Eindafrekening ENGIE (Electrabel nv), detailpagina's, factuurdatum 2026-06-08"
soort = "afrekening"
leverancier = "ENGIE"
netbeheerder = "Fluvius Midden-Vlaanderen"
netbeheerder_code = "FMV"
postcode = "9220"
segment = "Woning"
meter = "digitaal"

[btw]
basis_6pct = "684.62"
btw_6pct = "41.09"
vrijgesteld_injectie = "-196.68"
vrijgesteld_injectie_grond = "Beslissing ET 131.616/2 van 25-10-2019"
# Derde onafhankelijke bevestiging van de btw-behandeling van de
# injectievergoeding: ze valt volledig buiten de 6%-basis.

# --------------------------------------------------------------------------
# Elektriciteit — het personeelstarief
# --------------------------------------------------------------------------
[elektriciteit]
periode_van = "2025-07-06"
periode_tot = "2026-05-31"
product = "personeelstarief"
contracttype = "variabel"
looptijd = "onbepaalde duur"
afname_kwh = "3594"
injectie_kwh = "2696"
registerschema = "enkelvoudig"

[elektriciteit.componenten]
energie_afname_eur = "740.92"
energie_injectie_eur = "-196.68"
toeslagen_eur = "177.56"
korting_personeel_eur = "-413.32"
# **Er staat geen netwerkkostenregel op de elektriciteitshelft van deze
# factuur.** Niet nul, maar afwezig — en de rubriek "Netwerkkosten en
# toeslagen" noemt voor elektriciteit alleen de twee heffingen, terwijl diezelfde
# rubriek op de andere ENGIE-facturen wél een "gemiddelde distributiekosten
# elektriciteit" draagt. De prijsevolutietabel van de factuur noemt het totaal
# bovendien "netwerkkosten en toeslagen inbegrepen". De prijs van 0,2054 EUR/kWh
# is dus all-in.
netwerkkosten_eur = ""
netwerkkosten_aanwezig = false

[[elektriciteit.tariefkaart]]
